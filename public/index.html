<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Ziyaret Planlayıcı</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --danger: #dc2626;
    --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 1000;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 700;
  }
  .banner {
    background: #fef3c7;
    color: #92400e;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    display: none;
  }
  .banner.show { display: block; }
  .controls-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .controls-row label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }
  input[type="date"], select, input[type="text"] {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 14px;
    background: white;
  }
  .people-filter {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .person-chip {
    padding: 5px 10px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    font-size: 12px;
    cursor: pointer;
    background: white;
    user-select: none;
    white-space: nowrap;
  }
  .person-chip.active {
    border-color: var(--chip-color, var(--primary));
    background: var(--chip-color, var(--primary));
    color: white;
  }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #map { flex: 1; min-height: 0; }
  #sidebar {
    width: 340px;
    background: var(--card);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #sidebar h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    padding: 10px 12px 4px;
    margin: 0;
  }
  #search-box {
    padding: 8px 12px;
  }
  #search-results, #day-list {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  .org-item, .visit-item {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .org-item .name, .visit-item .name {
    font-weight: 600;
    display: block;
  }
  .org-item .addr, .visit-item .addr {
    color: var(--text-muted);
    font-size: 11px;
    display: block;
    margin-top: 2px;
  }
  .org-item .squad { font-size: 10px; color: var(--primary); }
  button {
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    background: var(--primary);
    color: white;
    white-space: nowrap;
  }
  button.secondary { background: #e2e8f0; color: var(--text); }
  button.danger { background: var(--danger); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .assign-row { display: flex; gap: 4px; align-items: center; }
  .order-badge {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .empty-state { padding: 20px 12px; color: var(--text-muted); font-size: 13px; text-align: center; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab-btn {
    flex: 1;
    background: none;
    color: var(--text-muted);
    border-radius: 0;
    padding: 10px;
    font-weight: 600;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: none; }
  .tab-panel { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .tab-panel.active { display: flex; }
  .leaflet-popup-content { font-size: 13px; }
  @media (max-width: 768px) {
    main { flex-direction: column; }
    #sidebar { width: 100%; height: 42vh; border-left: none; border-top: 1px solid var(--border); }
    #map { height: 58vh; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📍 Ziyaret Planlayıcı</h1>
    <div id="placeholder-banner" class="banner">
      ⚠️ Haritadaki konumlar PLACEHOLDER (yaklaşık) koordinatlardır. Gerçek adres konumları için <code>geocode.py</code> script'ini Google Maps API key ile çalıştırıp <code>locations.json</code>'ı güncelleyin.
    </div>
    <div class="controls-row">
      <label>Tarih:</label>
      <input type="date" id="date-picker" />
      <button class="secondary" id="today-btn">Bugün</button>
    </div>
    <div class="controls-row">
      <label>Satışçılar:</label>
      <div class="people-filter" id="people-filter"></div>
      <button class="secondary" id="add-person-btn" style="margin-left:auto;">+ Kişi ekle</button>
    </div>
  </header>
  <main>
    <div id="map"></div>
    <div id="sidebar">
      <div class="tabs">
        <button class="tab-btn active" data-tab="day">Günün Planı</button>
        <button class="tab-btn" data-tab="search">Müşteri Ekle</button>
      </div>
      <div class="tab-panel active" id="tab-day">
        <div id="day-list"></div>
      </div>
      <div class="tab-panel" id="tab-search">
        <div id="search-box">
          <input type="text" id="search-input" placeholder="Müşteri adı ara..." style="width:100%" />
        </div>
        <div id="search-results"></div>
      </div>
    </div>
  </main>
</div>

<script>
const CHIP_COLORS = ["#2563eb", "#16a34a", "#dc2626", "#d97706", "#7c3aed", "#0891b2", "#db2777", "#65a30d"];

let state = {
  date: new Date().toISOString().slice(0, 10),
  salespeople: [],
  activePeople: new Set(),
  organizations: [],
  visits: [],
  markers: {},        // key -> marker
  routeLines: {},      // salesperson -> polyline
};

const map = L.map("map").setView([39.0, 35.0], 6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors",
  maxZoom: 19,
}).addTo(map);

function colorForPerson(name) {
  const idx = state.salespeople.findIndex((p) => p.name === name);
  return CHIP_COLORS[idx % CHIP_COLORS.length] || "#2563eb";
}

async function api(path, opts) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  return res.json();
}

async function loadSalespeople() {
  state.salespeople = await api("/api/salespeople");
  if (state.activePeople.size === 0) {
    state.salespeople.forEach((p) => state.activePeople.add(p.name));
  }
  renderPeopleFilter();
}

function renderPeopleFilter() {
  const el = document.getElementById("people-filter");
  el.innerHTML = "";
  state.salespeople.forEach((p, i) => {
    const chip = document.createElement("div");
    chip.className = "person-chip" + (state.activePeople.has(p.name) ? " active" : "");
    chip.style.setProperty("--chip-color", CHIP_COLORS[i % CHIP_COLORS.length]);
    chip.textContent = p.name;
    chip.onclick = () => {
      if (state.activePeople.has(p.name)) state.activePeople.delete(p.name);
      else state.activePeople.add(p.name);
      renderPeopleFilter();
      refreshDay();
    };
    el.appendChild(chip);
  });
}

async function loadOrganizations(q) {
  const data = await api("/api/organizations" + (q ? "?q=" + encodeURIComponent(q) : ""));
  document.getElementById("placeholder-banner").classList.toggle("show", data.isPlaceholderData);
  return data.organizations;
}

async function refreshDay() {
  const allVisits = await api("/api/visits?date=" + state.date);
  state.visits = allVisits.filter((v) => state.activePeople.has(v.salesperson));
  renderDayList();
  renderMapForDay();
}

function renderDayList() {
  const el = document.getElementById("day-list");
  el.innerHTML = "";
  if (state.visits.length === 0) {
    el.innerHTML = '<div class="empty-state">Bu gün için henüz ziyaret atanmadı.<br/>"Müşteri Ekle" sekmesinden ekleyebilirsiniz.</div>';
    return;
  }
  // group by salesperson
  const bySales = {};
  state.visits.forEach((v) => {
    (bySales[v.salesperson] = bySales[v.salesperson] || []).push(v);
  });
  Object.entries(bySales).forEach(([person, visits]) => {
    const header = document.createElement("div");
    header.style.cssText = `padding:8px 12px 4px;font-weight:700;font-size:12px;color:${colorForPerson(person)}`;
    header.textContent = person + " (" + visits.length + " ziyaret)";
    el.appendChild(header);
    visits.sort((a, b) => a.order_in_day - b.order_in_day);
    visits.forEach((v, idx) => {
      const item = document.createElement("div");
      item.className = "visit-item";
      item.innerHTML = `
        <div class="order-badge" style="background:${colorForPerson(person)}">${idx + 1}</div>
        <div style="flex:1">
          <span class="name">${escapeHtml(v.org_name)}</span>
        </div>
        <button class="danger" data-id="${v.id}">Sil</button>
      `;
      item.querySelector("button").onclick = async () => {
        await api("/api/visits/" + v.id, { method: "DELETE" });
        refreshDay();
      };
      el.appendChild(item);
    });
  });
}

function renderMapForDay() {
  // clear old markers/lines
  Object.values(state.markers).forEach((m) => map.removeLayer(m));
  Object.values(state.routeLines).forEach((l) => map.removeLayer(l));
  state.markers = {};
  state.routeLines = {};

  const orgByKey = {};
  state.organizations.forEach((o) => (orgByKey[o.key] = o));

  const bySales = {};
  state.visits.forEach((v) => {
    (bySales[v.salesperson] = bySales[v.salesperson] || []).push(v);
  });

  const bounds = [];
  Object.entries(bySales).forEach(([person, visits]) => {
    visits.sort((a, b) => a.order_in_day - b.order_in_day);
    const color = colorForPerson(person);
    const latlngs = [];
    visits.forEach((v, idx) => {
      const org = orgByKey[v.org_key];
      if (!org) return;
      const marker = L.marker([org.lat, org.lng], {
        icon: L.divIcon({
          className: "",
          html: `<div style="background:${color};color:white;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.3)">${idx + 1}</div>`,
          iconSize: [26, 26],
          iconAnchor: [13, 13],
        }),
      }).addTo(map);
      marker.bindPopup(`<b>${escapeHtml(org.name)}</b><br/>${escapeHtml(org.address)}<br/><small>${escapeHtml(person)} · Durak ${idx + 1}</small>`);
      state.markers[v.id] = marker;
      latlngs.push([org.lat, org.lng]);
      bounds.push([org.lat, org.lng]);
    });
    if (latlngs.length > 1) {
      state.routeLines[person] = L.polyline(latlngs, { color, weight: 3, opacity: 0.7, dashArray: "6,6" }).addTo(map);
    }
  });

  if (bounds.length > 0) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
  }
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}

// --- Search / assign tab ---
let searchTimeout;
document.getElementById("search-input").addEventListener("input", (e) => {
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();
  searchTimeout = setTimeout(async () => {
    const results = q.length >= 2 ? await loadOrganizations(q) : [];
    renderSearchResults(results);
  }, 250);
});

function renderSearchResults(results) {
  const el = document.getElementById("search-results");
  el.innerHTML = "";
  if (results.length === 0) {
    el.innerHTML = '<div class="empty-state">Müşteri adı yazarak arayın (en az 2 karakter).</div>';
    return;
  }
  results.slice(0, 100).forEach((org) => {
    const item = document.createElement("div");
    item.className = "org-item";
    const activePeopleArr = [...state.activePeople];
    const options = activePeopleArr.map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("");
    item.innerHTML = `
      <div style="flex:1">
        <span class="name">${escapeHtml(org.name)}</span>
        <span class="addr">${escapeHtml(org.address)}</span>
        <span class="squad">${escapeHtml(org.squad || "")}</span>
      </div>
      <div class="assign-row">
        <select class="assign-person">${options}</select>
        <button class="assign-btn">Ekle</button>
      </div>
    `;
    item.querySelector(".assign-btn").onclick = async () => {
      const person = item.querySelector(".assign-person").value;
      if (!person) return alert("Önce üstten en az bir satışçı seçili olmalı.");
      await api("/api/visits", {
        method: "POST",
        body: JSON.stringify({
          org_key: org.key,
          org_name: org.name,
          salesperson: person,
          visit_date: state.date,
        }),
      });
      refreshDay();
      switchTab("day");
    };
    el.appendChild(item);
  });
}

// --- tabs ---
function switchTab(name) {
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
  document.getElementById("tab-day").classList.toggle("active", name === "day");
  document.getElementById("tab-search").classList.toggle("active", name === "search");
}
document.querySelectorAll(".tab-btn").forEach((b) => (b.onclick = () => switchTab(b.dataset.tab)));

// --- date picker ---
const datePicker = document.getElementById("date-picker");
datePicker.value = state.date;
datePicker.addEventListener("change", (e) => {
  state.date = e.target.value;
  refreshDay();
});
document.getElementById("today-btn").onclick = () => {
  state.date = new Date().toISOString().slice(0, 10);
  datePicker.value = state.date;
  refreshDay();
};

// --- add person ---
document.getElementById("add-person-btn").onclick = async () => {
  const name = prompt("Yeni satışçı adı:");
  if (!name || !name.trim()) return;
  const result = await api("/api/salespeople", { method: "POST", body: JSON.stringify({ name }) });
  if (result.error) return alert("Bu isim zaten var.");
  await loadSalespeople();
};

// --- init ---
(async function init() {
  await loadSalespeople();
  state.organizations = await loadOrganizations("");
  await refreshDay();
})();
</script>
</body>
</html>
